plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace = 'com.haset.hasetapp'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.haset.hasetapp"
        minSdk = 24
        targetSdk = 37
        versionCode = 16
        versionName = "1.0.0.DTC"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        
        // ARM for devices, x86_64 for ChromeOS/emulators (Play Console requirement).
        // x86 still excluded to keep size down.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        
        // Room schema export location (for database migration tracking)
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            def keystorePath = keystoreProperties.getProperty("storeFile", "keyforAfyaNew.jks")
            def keystoreFile = rootProject.file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = keystoreProperties.getProperty("storePassword", System.getenv("STORE_PASSWORD"))
                keyAlias = keystoreProperties.getProperty("keyAlias", System.getenv("KEY_ALIAS"))
                keyPassword = keystoreProperties.getProperty("keyPassword", System.getenv("KEY_PASSWORD"))
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    buildFeatures {
        viewBinding = true
    }
    
    // Fix for 16 KB page alignment (Android 15+ compatibility)
    // Setting this to true extracts native libs at install time, avoiding alignment issues
    // with older libraries like Fresco (the imagepipeline native library) that are not 16KB aligned.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Keep app-release.aab for AGP/IDE; also copy app-release-v{versionCode}.aab for uploads.
tasks.register("copyVersionedReleaseBundle") {
    doLast {
        def versionedName = "app-release-v${android.defaultConfig.versionCode}.aab"
        def candidates = [
                file("${layout.buildDirectory.get().asFile}/outputs/bundle/release/app-release.aab"),
                file("${projectDir}/release/app-release.aab")
        ]
        candidates.each { defaultAab ->
            if (!defaultAab.exists()) return
            def versionedAab = new File(defaultAab.parentFile, versionedName)
            versionedAab.bytes = defaultAab.bytes
            println "Created: ${versionedAab.absolutePath}"
        }
    }
}

// Lazy: AGP creates bundleRelease after this script is evaluated.
tasks.configureEach { task ->
    if (task.name == "bundleRelease" || task.name == "produceReleaseBundleIdeListingFile") {
        task.finalizedBy("copyVersionedReleaseBundle")
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.androidx.browser
    implementation libs.androidx.print
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    
    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.database
    implementation libs.firebase.messaging
    implementation libs.firebase.crashlytics
    implementation libs.firebase.analytics
    
    // Room Database (Local Storage)
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    
    // OkHttp BOM (Bill of Materials) - must be declared as platform
    implementation platform(libs.okhttp.bom)
    implementation libs.okhttp
    
    // Retrofit for API
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    
    // Lifecycle & ViewModel
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    
    // RecyclerView & CardView
    implementation libs.recyclerview
    implementation libs.cardview
    
    // ViewPager2
    implementation libs.viewpager2
    
    // SwipeRefreshLayout
    implementation libs.swiperefreshlayout
    
    // Glide for images (+ OkHttp so CDN loads get real timeouts/retries)
    implementation libs.glide
    implementation libs.glide.okhttp3.integration
    annotationProcessor libs.glide.compiler
    
    // CircleImageView
    implementation libs.circleimageview
    
    // Google Play Services Location
    implementation libs.google.play.services.location

    // Google Sign-In
    implementation libs.google.play.services.auth
    
    // Gson for JSON parsing
    implementation libs.gson
    
    // Facebook Shimmer for loading effects
    implementation libs.shimmer
    
    // Cloudinary for media upload
    implementation libs.cloudinary.android
    
    // Force Fresco for Android 15 16KB page size compatibility (Pulled by Cloudinary)
    implementation libs.fresco
    implementation libs.fresco.imagepipeline
    implementation libs.fresco.nativeimagefilters
    implementation libs.fresco.nativeimagetranscoder
    
    // zxing for QR Code generation
    implementation libs.zxing.core
    implementation libs.zxing.android.embedded
    
    // WorkManager for background tasks
    implementation libs.work.runtime

    // First-time in-app spotlight tips
    implementation libs.taptargetview
}

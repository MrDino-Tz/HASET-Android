<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HASET Health Tips</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #17212b;
      --muted: #657282;
      --line: #dde5ef;
      --brand: #008c95;
      --brand-dark: #006c73;
      --danger: #b42318;
      --ok: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 680px;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.ok {
      color: var(--ok);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(320px, 1.2fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(22, 34, 48, 0.06);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.2;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #344252;
      font-size: 14px;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 140, 149, 0.14);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .row input {
      width: auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .primary {
      background: var(--brand);
      color: #ffffff;
    }

    .primary:hover:not(:disabled) {
      background: var(--brand-dark);
    }

    .secondary {
      background: #e7eef6;
      color: #253244;
    }

    .danger {
      background: #fee4e2;
      color: var(--danger);
    }

    .signin {
      max-width: 430px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .tip {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfdff;
    }

    .tip p {
      margin: 0 0 10px;
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: #e7f6ed;
      color: var(--ok);
      font-weight: 700;
    }

    .badge.off {
      background: #eef2f6;
      color: #596579;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Health Tips</h1>
        <p class="subtitle">Post short health tips to the app. Published tips are saved to <strong>health_quotes</strong> and appear in the Android Health Tips tab.</p>
      </div>
      <button id="signOutButton" class="secondary hidden" type="button">Sign out</button>
    </header>

    <section id="signinPanel" class="panel signin">
      <h2>Admin Sign In</h2>
      <form id="signinForm">
        <label for="email">Email</label>
        <input id="email" autocomplete="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" autocomplete="current-password" type="password" required>

        <div class="actions">
          <button class="primary" type="submit">Sign in</button>
        </div>
      </form>
      <p id="signinStatus" class="status"></p>
    </section>

    <section id="adminPanel" class="grid hidden">
      <form id="tipForm" class="panel">
        <h2>New Tip</h2>
        <label for="text">Tip Text</label>
        <textarea id="text" maxlength="600" placeholder="Drink clean water regularly and seek care early when symptoms persist." required></textarea>

        <label for="author">Author</label>
        <input id="author" maxlength="80" value="HASET Hospital" required>

        <label class="row" for="enabled">
          <input id="enabled" type="checkbox" checked>
          Publish now
        </label>

        <div class="actions">
          <button id="saveButton" class="primary" type="submit">Post tip</button>
          <button id="resetButton" class="secondary" type="button">Reset</button>
        </div>
        <p id="formStatus" class="status"></p>
      </form>

      <section class="panel">
        <h2>Recent Tips</h2>
        <div id="tipsList" class="list"></div>
        <p id="listStatus" class="status">Loading tips...</p>
      </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      limitToLast,
      onValue,
      orderByChild,
      push,
      query,
      ref,
      remove,
      serverTimestamp,
      set,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6XncMhXdlT0fScdU6Fq7Nw_toPmf-tRU",
      authDomain: "hasetapp-4eeba.firebaseapp.com",
      databaseURL: "https://hasetapp-4eeba-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hasetapp-4eeba",
      storageBucket: "hasetapp-4eeba.firebasestorage.app",
      messagingSenderId: "44252460208"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const signinPanel = document.querySelector("#signinPanel");
    const adminPanel = document.querySelector("#adminPanel");
    const signinForm = document.querySelector("#signinForm");
    const tipForm = document.querySelector("#tipForm");
    const signinStatus = document.querySelector("#signinStatus");
    const formStatus = document.querySelector("#formStatus");
    const listStatus = document.querySelector("#listStatus");
    const tipsList = document.querySelector("#tipsList");
    const signOutButton = document.querySelector("#signOutButton");
    const saveButton = document.querySelector("#saveButton");
    let tipsUnsubscribe = null;

    function setStatus(node, message, type = "") {
      node.textContent = message;
      node.className = `status ${type}`.trim();
    }

    function showSignedIn(user) {
      signinPanel.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      signOutButton.classList.remove("hidden");
      watchTips();
    }

    function showSignedOut() {
      signinPanel.classList.remove("hidden");
      adminPanel.classList.add("hidden");
      signOutButton.classList.add("hidden");
      tipsList.replaceChildren();
      if (tipsUnsubscribe) tipsUnsubscribe();
      tipsUnsubscribe = null;
    }

    async function isAdmin(uid) {
      const userRef = ref(db, `users/${uid}/role`);
      return new Promise((resolve) => {
        const off = onValue(userRef, (snapshot) => {
          off();
          resolve(snapshot.val() === "admin");
        }, () => {
          off();
          resolve(false);
        }, { onlyOnce: true });
      });
    }

    function watchTips() {
      if (tipsUnsubscribe) tipsUnsubscribe();
      const tipsQuery = query(ref(db, "health_quotes"), orderByChild("createdAt"), limitToLast(30));
      tipsUnsubscribe = onValue(tipsQuery, (snapshot) => {
        const rows = [];
        snapshot.forEach((child) => {
          rows.push({ id: child.key, ...child.val() });
        });
        rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        renderTips(rows);
      }, (error) => {
        setStatus(listStatus, error.message, "error");
      });
    }

    function renderTips(rows) {
      tipsList.replaceChildren();
      setStatus(listStatus, rows.length ? "" : "No health tips posted yet.");

      for (const tip of rows) {
        const article = document.createElement("article");
        article.className = "tip";

        const text = document.createElement("p");
        text.textContent = tip.text || "";

        const meta = document.createElement("div");
        meta.className = "meta";

        const left = document.createElement("span");
        const date = tip.createdAt ? new Date(tip.createdAt).toLocaleString() : "No date";
        left.textContent = `${tip.author || "HASET Hospital"} - ${date}`;

        const badge = document.createElement("span");
        const enabled = tip.enabled !== false;
        badge.className = enabled ? "badge" : "badge off";
        badge.textContent = enabled ? "Published" : "Hidden";

        const actions = document.createElement("div");
        actions.className = "actions";

        const toggle = document.createElement("button");
        toggle.className = "secondary";
        toggle.type = "button";
        toggle.textContent = enabled ? "Hide" : "Publish";
        toggle.addEventListener("click", () => update(ref(db, `health_quotes/${tip.id}`), {
          enabled: !enabled,
          updatedAt: serverTimestamp()
        }));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", async () => {
          if (confirm("Delete this health tip?")) {
            await remove(ref(db, `health_quotes/${tip.id}`));
          }
        });

        meta.append(left, badge);
        actions.append(toggle, deleteButton);
        article.append(text, meta, actions);
        tipsList.append(article);
      }
    }

    signinForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus(signinStatus, "Signing in...");
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        if (!(await isAdmin(credential.user.uid))) {
          await signOut(auth);
          setStatus(signinStatus, "This account is not an admin.", "error");
          return;
        }
        setStatus(signinStatus, "");
      } catch (error) {
        setStatus(signinStatus, error.message, "error");
      }
    });

    tipForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const text = document.querySelector("#text").value.trim();
      const author = document.querySelector("#author").value.trim() || "HASET Hospital";
      const enabled = document.querySelector("#enabled").checked;

      if (!text) {
        setStatus(formStatus, "Tip text is required.", "error");
        return;
      }

      saveButton.disabled = true;
      setStatus(formStatus, "Posting...");

      try {
        const newTipRef = push(ref(db, "health_quotes"));
        await set(newTipRef, {
          text,
          author,
          enabled,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          createdBy: user.uid
        });
        tipForm.reset();
        document.querySelector("#author").value = "HASET Hospital";
        document.querySelector("#enabled").checked = true;
        setStatus(formStatus, "Health tip posted.", "ok");
      } catch (error) {
        setStatus(formStatus, error.message, "error");
      } finally {
        saveButton.disabled = false;
      }
    });

    document.querySelector("#resetButton").addEventListener("click", () => {
      tipForm.reset();
      document.querySelector("#author").value = "HASET Hospital";
      document.querySelector("#enabled").checked = true;
      setStatus(formStatus, "");
    });

    signOutButton.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showSignedOut();
        return;
      }
      if (await isAdmin(user.uid)) {
        showSignedIn(user);
      } else {
        await signOut(auth);
        showSignedOut();
        setStatus(signinStatus, "This account is not an admin.", "error");
      }
    });
  </script>
</body>
</html>
